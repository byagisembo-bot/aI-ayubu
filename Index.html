
<!DOCTYPE html><html lang="rw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ALAFRI AI</title><style>*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}body{background:#000;color:#fff;display:flex;justify-content:center;min-height:100vh}.app{width:100%;max-width:500px;background:#0a0a0a;display:flex;flex-direction:column;min-height:100vh}.header{padding:16px;background:#111;border-bottom:3px solid #ffcc00;text-align:center}.logo{font-weight:900;color:#ffcc00;font-size:24px}.ai-face{width:120px;height:120px;margin:16px auto;background:radial-gradient(circle,#ffcc00,#ff8800);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:50px;animation:pulse 1.5s infinite;cursor:pointer}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}.listening .ai-face{background:radial-gradient(circle,#00ff88,#00aa55);animation:pulse 0.5s infinite}.chat{padding:12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.msg{padding:12px 14px;border-radius:16px;max-width:85%;font-size:14px}.msg-user{align-self:flex-end;background:#ffcc00;color:#000;font-weight:600}.msg-ai{align-self:flex-start;background:#1e1e1e;border:1px solid #333}.input-area{display:flex;gap:8px;padding:12px;background:#111;position:sticky;bottom:0;border-top:2px solid #222}.input-area input{flex:1;padding:14px;background:#1e1e1e;border:2px solid #333;color:#fff;border-radius:99px;font-size:15px;outline:none}.btn-send{padding:14px 18px;background:#ffcc00;color:#000;border:none;border-radius:99px;font-weight:900}.btn-mic{padding:14px 16px;background:#222;color:#ffcc00;border:2px solid #333;border-radius:99px}.btn-mic.active{background:#00ff88;color:#000}.action{background:#ffcc00;color:#000;padding:14px;border-radius:14px;margin:10px 12px;font-weight:900;text-align:center}.cmds{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}.cmd{white-space:nowrap;background:#222;border:1px solid #333;border-radius:99px;padding:8px 14px;font-size:11px;cursor:pointer}</style></head><body><div class="app"><div class="header"><div class="logo">🧠 ALAFRI AI</div><div style="font-size:10px;color:#888">ANDIKA CYANGWA VUGANA - NDUMVA BYOSE</div></div><div id="face" class="ai-face" onclick="toggleListen()">🧠</div><div id="status" style="text-align:center;font-size:11px;color:#666;margin-bottom:8px">Andika hasi cyangwa kanda 🎤</div><div class="cmds"><div class="cmd" onclick="sendText('fungura bet nshya')">➕ Fungura Bet</div><div class="cmd" onclick="sendText('bara cote 2.5 na 10000')">🧮 Bara</div><div class="cmd" onclick="sendText('profit yanjye')">💰 Profit</div><div class="cmd" onclick="sendText('match ziza')">⚽ Match</div></div><div class="chat" id="chat"><div class="msg msg-ai">Muraho Boss! 👋 Ndi ALAFRI AI - Mfite ubwenge! ✍️ Andika hasi cyangwa 🎤 vugana - Ndumva byose! Gerageza: "fungura bet", "bara cote", "profit yanjye"</div></div><div id="actionArea"></div><div class="input-area"><button id="micBtn" class="btn-mic" onclick="toggleListen()">🎤</button><input id="textInput" placeholder="Andika hano Boss..." onkeypress="if(event.key==='Enter')sendFromInput()"><button class="btn-send" onclick="sendFromInput()">➤</button></div></div><script>let listening=false,recognition=null;if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.lang='en-US';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{listening=true;document.body.classList.add('listening');document.getElementById('micBtn').classList.add('active');document.getElementById('status').innerHTML='🔴 NDAGUTEGEREJE... Vuga!';document.getElementById('status').style.color='#00ff88'};recognition.onend=()=>{listening=false;document.body.classList.remove('listening');document.getElementById('micBtn').classList.remove('active');document.getElementById('status').innerHTML='Andika hasi cyangwa kanda 🎤';document.getElementById('status').style.color='#666'};recognition.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;if(e.results[0].isFinal)sendText(t);else document.getElementById('textInput').value=t;}}function toggleListen(){if(!recognition){alert('Koresha Chrome');return;}if(listening)recognition.stop();else{try{recognition.start();}catch{recognition.stop();setTimeout(()=>recognition.start(),200);}}}function sendFromInput(){const i=document.getElementById('textInput');if(!i.value.trim())return;sendText(i.value.trim());i.value='';}function sendText(text){addMsg(text,'user');understandAndDo(text);}function addMsg(text,type){const chat=document.getElementById('chat');const div=document.createElement('div');div.className='msg '+(type==='user'?'msg-user':'msg-ai');div.innerHTML=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;}function understandAndDo(text){const t=text.toLowerCase();let response='',actionHTML='';if(t.includes('bet')||t.includes('fungura')||t.includes('nshya')){response=`Yego Boss! Numvise "${text}" - Ngiye gufungura BET nshya!`;actionHTML=`<div class="action">➕ Fungura Bet<br><button onclick="window.open('https://alafri-bet.onrender.com','_blank')" style="margin-top:8px;padding:10px 20px;background:#000;color:#ffcc00;border:none;border-radius:99px;font-weight:900">FUNGURA NONAHA</button></div>`;}else if(t.includes('bara')||t.includes('cote')||t.match(/\d+\.\d+/)){const nums=text.match(/\d+(\.\d+)?/g);let cote=nums?parseFloat(nums[0]):2.5;let stake=nums&&nums[1]?parseFloat(nums[1]):10000;let win=cote*stake;response=`🧮 Numvise! Cote ${cote} × ${stake.toLocaleString()} = WIN: ${win.toLocaleString()} RWF, PROFIT: ${(win-stake).toLocaleString()}`;actionHTML=`<div class="action">🧮 WIN: ${win.toLocaleString()} RWF</div>`;}else if(t.includes('profit')||t.includes('amafaranga')||t.includes('ingana')){response=`💰 Boss, profit yawe - Injira muri Alafri Bet Dashboard!`;actionHTML=`<div class="action">💰 PROFIT CHECK<br><button onclick="window.open('https://alafri-bet.onrender.com','_blank')" style="margin-top:8px;padding:10px 20px;background:#000;color:#ffcc00;border:none;border-radius:99px;font-weight:900">REBA DASHBOARD</button></div>`;}else if(t.includes('match')||t.includes('umupira')||t.includes('ziza')){response=`⚽ Match ziza uyumunsi: Arsenal vs Man City 2.10, Real vs Barca 1.95, Bayern vs Dortmund 1.85`;}else if(t.includes('muraho')||t.includes('hello')||t.includes('bite')){response=`Muraho Boss! Ndi Alafri AI - Mfite ubwenge bwose! Wanditse "${text}" - Nabyumvise! Nyibwire: Fungura bet, Bara cote, Profit?`;}else{response=`🤔 Numvise: "${text}" - Ndatekereza... Andika: fungura bet / bara cote / profit`;actionHTML=`<div class="action">🧠 NDIMO GUTEKEREZA<br>"${text}"</div>`;}setTimeout(()=>{addMsg(response,'ai');if(actionHTML)document.getElementById('actionArea').innerHTML=actionHTML;if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(response.replace(/<[^>]*>/g,''));u.lang='en-US';u.rate=0.95;speechSynthesis.speak(u);}},400);}</script></body></html>
